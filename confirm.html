<!doctype html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">

    <title>Potvrzení odběru – Hlídač směn SODAT</title>

    <link rel="icon" type="image/svg+xml" href="icon/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <script src="confirm.js" defer></script>
</head>
<body>
    <main class="shell">
        <section class="hero"><h1>SODAT směny, které ti <span>vyhovují.</span></h1></section>

        <div class="layout">
            <section class="card confirmation-card">
                <div class="card-heading">
                    <div>
                        <h2>Potvrzení odběru upozornění</h2>
                        <p>Kliknutím na tlačítko potvrdíš odběr upozornění na nové směny, které ti vyhovují.</p>
                    </div>
                </div>

                <button class="button-primary" id="confirm-button" type="button">Potvrdit odběr</button>
                <div class="feedback" id="confirm-feedback" role="status" aria-live="polite" hidden></div>
            </section>
        </div>

        <footer>Hlídač směn není provozován společností SODAT.</footer>
    </main>
</body>
</html>
